{% extends 'blog/base.html' %}

{% block content %}
<h1>Liste des articles</h1>

{% for article in articles %}
    <h2>{{ article.titre }}</h2>
    <p>{{ article.contenu }}</p>
    <p>Publié le {{ article.date_publication }}</p>
    <hr>
{% empty %}
    <p>Aucun article disponible.</p>
{% endfor %}
{% endblock %}
